name: Mutants

# Puts each fixed bug in scripts/mutants/ back and expects the tests to catch it. On a pull request it runs only the
# patches the pull request can affect (see scripts/mutants.sh). A change outside what a patch touches or tests can
# still turn a kill into a survivor in rare cases, so every patch runs on each push to main that touches the code,
# weekly, and by hand. A survivor is then found within one merge.
on:
  pull_request:
    paths:
      - 'plugins/*/hooks/**'
      - 'plugins/*/tests/**'
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'scripts/**'
      - '.github/claude-code-version'
      - '.github/workflows/mutants.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/*/hooks/**'
      - 'plugins/*/tests/**'
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'scripts/**'
      - '.github/claude-code-version'
      - '.github/workflows/mutants.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Other runs are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the pull request's base commit is there to diff against. Without it the script would
      # find no base and run every patch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same pinned Claude Code as validate.yml, so a mutant is judged by the tests alone and not by a new release.
      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat .github/claude-code-version)"
          claude --version
      # On a pull request the base is its base commit, and the log says which patches ran and which were skipped and
      # why. Elsewhere the base is empty, so every patch runs.
      - name: Check every mutant is caught
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: sh scripts/mutants.sh "$BASE"
