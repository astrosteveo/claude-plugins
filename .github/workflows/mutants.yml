name: Mutants

# Puts each fixed bug in scripts/mutants/ back and expects the tests to catch it. It runs on pull requests that touch
# the code, tests or mutants (a hook change can also leave a patch stale), weekly, and by hand.
on:
  pull_request:
    paths:
      - 'plugins/*/hooks/**'
      - 'plugins/*/tests/**'
      - 'plugins/*/.claude-plugin/plugin.json'
      - 'scripts/**'
      - '.github/claude-code-version'
      - '.github/workflows/mutants.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Other runs are left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The same pinned Claude Code as validate.yml, so a mutant is judged by the tests alone and not by a new release.
      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@$(cat .github/claude-code-version)"
          claude --version
      - name: Check every mutant is caught
        run: sh scripts/mutants.sh
