name: Validate plugins

# Every run installs the latest Claude Code, the version the plugins are written against. The weekly run notices a new
# release that breaks the plugins when nothing has been pushed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its run in progress. Other runs are left to finish. The event is in the group so
# the weekly run never queues behind, or displaces, a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code@latest
          claude --version
      - name: Validate marketplace and plugins
        run: sh scripts/validate.sh
      - name: Test plugins
        run: sh scripts/test.sh
      - name: Type-check plugins
        run: sh scripts/typecheck.sh
