name: Task
description: Something wrong or wanted, with the outcomes that make it done.
body:
  - type: textarea
    id: what
    attributes:
      label: What and why
      description: What is wrong or wanted, and why it matters. A few short sentences.
      placeholder: Opening the pane on a narrow terminal cuts off the filters, so they can't be pressed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: One box for each outcome that can be checked. The issue board shows these and ticks them as they're done.
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
